version: '3'

services:
  web:
    container_name: mobiliaria-maps
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3501:3000
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Overriding DATABASE_URL to access host's MySQL
      # Replace 'localhost' with 'host.docker.internal' in your .env or here
      - DATABASE_URL=${DATABASE_URL_DOCKER:-mysql://dockerUser:pa%24%24Inmobiliarias9@host.docker.internal:3306/geoinmuebles}
